# nginx reverse proxy for the LTER-LIFE metadata harvester.
#
# This is ONE vhost — it coexists with other services on the VM because nginx
# routes by the `server_name` (Host header). It only handles requests for
# lter-life-harvester.qcdis.org; other domains keep hitting their own vhosts.
#
#   sudo cp ~/harvester/deploy/nginx-harvester.conf /etc/nginx/sites-available/harvester
#   sudo ln -s /etc/nginx/sites-available/harvester /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lter-life-harvester.qcdis.org
#
# certbot rewrites this file in place to add the `listen 443 ssl` server block,
# the certificate paths, and an HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name lter-life-harvester.qcdis.org;

    # GeoNetwork ZIP pushes can be large
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # harvest / enrich status polling can sit open for a while
        proxy_connect_timeout 60s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_buffering       off;
    }
}
